<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School SaaS Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="supabase-client.js" defer></script>
  </head>
  <body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen" hidden>
      <div class="login-overlay">
        <div class="login-box">
          <div class="login-brand">
            <div class="brand-mark">A5</div>
            <div>
              <strong>Alima OS</strong>
              <span>Admin A5</span>
            </div>
          </div>
          <h2>Sign In</h2>
          <p class="login-sub">Enter your credentials to continue</p>
          <div class="login-field">
            <label>Email</label>
            <input id="login-email" type="email" placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="login-field">
            <label>Password</label>
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button id="login-btn" class="primary-button" style="width:100%;min-height:2.6rem">Sign In</button>
          <div id="login-error" class="login-error"></div>
        </div>
      </div>
    </div>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">A5</div>
          <div>
            <strong>Alima OS</strong>
            <span data-i18n="brandSubtitle">Admin A5</span>
          </div>
        </div>

        <div class="sidebar-version" id="sidebar-version"></div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="dashboard">
            <span class="icon" aria-hidden="true">⌂</span>
            <span class="nav-label" data-i18n="navDashboard">Dashboard</span>
          </button>
          <button class="nav-item" data-page="students">
            <span class="icon" aria-hidden="true">◫</span>
            <span class="nav-label" data-i18n="navStudents">Peserta Didik</span>
          </button>
          <button class="nav-item" data-page="finance">
            <span class="icon" aria-hidden="true">◇</span>
            <span class="nav-label" data-i18n="navFinance">Uang Sekolah</span>
          </button>
          <button class="nav-item" data-page="staff">
            <span class="icon" aria-hidden="true">◎</span>
            <span class="nav-label" data-i18n="navStaff">Kepegawaian</span>
          </button>
          <button class="nav-item" data-page="inventory">
            <span class="icon" aria-hidden="true">▣</span>
            <span class="nav-label" data-i18n="navInventory">Sarpras</span>
          </button>
          <button class="nav-item" data-page="letters">
            <span class="icon" aria-hidden="true">✉</span>
            <span class="nav-label" data-i18n="navLetters">Surat</span>
            <span class="nav-badge" id="letters-badge"></span>
          </button>
          <button class="nav-item" data-page="users">
            <span class="icon" aria-hidden="true">◉</span>
            <span class="nav-label" data-i18n="navUsers">Users</span>
          </button>
          <button class="nav-item" data-page="audit">
            <span class="icon" aria-hidden="true">◌</span>
            <span class="nav-label" data-i18n="navAudit">Log Audit</span>
          </button>
          <button class="nav-item" data-page="diagnostics">
            <span class="icon" aria-hidden="true">⚙</span>
            <span class="nav-label" data-i18n="navDiagnostics">Diagnostics</span>
          </button>
          <button class="nav-item" data-page="client">
            <span class="icon" aria-hidden="true">☰</span>
            <span class="nav-label" data-i18n="navClient">Client</span>
          </button>
        </nav>
      </aside>

      <div class="workspace">
        <div id="app-toast" aria-live="polite"></div>
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menuToggle" aria-label="Open menu">☰</button>
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search dashboard" />
          </div>
          <div class="toolbar">
            <select id="languageSelect" aria-label="Language">
              <option value="en">ENG</option>
              <option value="id">ID</option>
            </select>
            <select id="themeMode" aria-label="Theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
            <input id="themeColor" type="color" value="#071315" aria-label="Background color" />
            <div class="profile">
              <div class="avatar" id="profile-avatar">AU</div>
              <div>
                <strong id="profile-name">Admin User</strong>
                <span id="profile-email">admin@school.test</span>
              </div>
              <span class="profile-role-badge" id="profile-role-badge">Role</span>
              <button class="icon-button" id="logout-btn" aria-label="Logout" title="Logout">⏻</button>
            </div>
          </div>
        </header>

        <main class="content">
          <section class="page active" id="dashboard">
            <div class="page-heading">
              <div>
                <p class="eyebrow" data-i18n="moduleSuperAdmin">Dashboard</p>
                <h1 data-i18n="dashboardTitle">Admin Dashboard</h1>
                <span id="dash-greeting" style="font-size:0.85rem;color:var(--muted)"></span>
              </div>
            </div>
            <div id="dash-content" style="display:grid;gap:1rem;padding:0 2rem 2rem">
              <div class="module-stat-grid" id="dash-stats" style="grid-template-columns:repeat(auto-fill,minmax(11rem,1fr))"></div>
              <div class="dash-panels" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div class="module-table-card" id="dash-recent" style="padding:1rem;min-height:8rem"></div>
                <div class="module-table-card" id="dash-alerts" style="padding:1rem;min-height:8rem"></div>
              </div>
            </div>
          </section>

          <section class="page" id="students" data-simple-page="students"></section>
          <section class="page" id="finance">
            <div class="us-page">
              <div class="page-heading">
                <div>
                  <p class="eyebrow" data-i18n="navFinance">Uang Sekolah</p>
                  <h1>US Payment Tracker</h1>
                </div>
                <div class="us-actions">
                  <span class="us-last-updated" id="us-last-updated">Updated: -</span>
                  <button class="primary-button" id="us-load-db">Load DB</button>
                  <button class="primary-button secondary" id="us-export">Export</button>
                </div>
              </div>

              <div class="us-upload-grid" id="us-upload-grid">
                <label class="us-upload-card" id="us-card-students">
                  <input type="file" id="us-file-students" accept=".xlsx,.xls" />
                  <span class="us-upload-icon">▤</span>
                  <strong>Student Master Data</strong>
                  <small>NO / STUDENT CODE / INDUK / NAMA / KELAS / VA / KET</small>
                  <em id="us-students-filename"></em>
                  <em class="us-upload-meta" id="us-students-uploaded">Students uploaded: -</em>
                </label>
                <label class="us-upload-card" id="us-card-payments">
                  <input type="file" id="us-file-payments" accept=".xlsx,.xls" />
                  <span class="us-upload-icon">◇</span>
                  <strong>Payment Records</strong>
                  <small>SPP / US payment data from Excel</small>
                  <em id="us-payments-filename"></em>
                  <em class="us-upload-meta" id="us-payments-uploaded">Payments uploaded: -</em>
                </label>
              </div>

              <div class="us-stats">
                <button class="module-stat tone-filled-teal" type="button">
                  <span>Total Students</span>
                  <strong id="us-s-total">0</strong>
                  <small id="us-s-month">No month selected</small>
                </button>
                <button class="module-stat tone-filled-violet" type="button">
                  <span>Paid</span>
                  <strong id="us-s-paid">0</strong>
                  <small id="us-s-paid-pct">0%</small>
                </button>
                <button class="module-stat tone-filled-orange" type="button" id="us-open-outstanding">
                  <span>Outstanding</span>
                  <strong id="us-s-out">0</strong>
                  <small id="us-s-out-pct">0%</small>
                </button>
                <button class="module-stat tone-filled-pink" type="button">
                  <span>Total Outstanding</span>
                  <strong id="us-s-out-total">Rp 0</strong>
                  <small>Selected period</small>
                </button>
                <button class="module-stat tone-filled-sand" type="button">
                  <span>Denda</span>
                  <strong id="us-s-denda">Rp 0</strong>
                  <small>After cutoff</small>
                </button>
                <button class="module-stat tone-filled-green" type="button" id="us-open-today">
                  <span>Paid Today</span>
                  <strong id="us-s-today">0</strong>
                  <small>Click to view</small>
                </button>
              </div>

              <div class="us-controls">
                <div class="us-search">
                  <span>⌕</span>
                  <input id="us-search" type="search" placeholder="Search student..." />
                </div>
                <select id="us-grade">
                  <option value="">All Grades</option>
                  <option value="X">Grade X</option>
                  <option value="XI">Grade XI</option>
                  <option value="XII">Grade XII</option>
                </select>
                <select id="us-class">
                  <option value="">All Classes</option>
                </select>
                <select id="us-status">
                  <option value="">All Status</option>
                  <option value="outstanding">Outstanding</option>
                  <option value="paid">Paid</option>
                </select>
                <select id="us-view">
                  <option value="current">Current month</option>
                  <option value="all">All months</option>
                  <option value="ytd">Year to date</option>
                </select>
                <div class="us-month-nav">
                  <button type="button" id="us-prev-month" aria-label="Previous month">‹</button>
                  <strong id="us-month-label">-</strong>
                  <button type="button" id="us-next-month" aria-label="Next month">›</button>
                  <button type="button" id="us-current-month">Today</button>
                </div>
              </div>

              <section class="us-table-shell">
                <div class="us-empty" id="us-empty">
                  <strong>No payment data yet</strong>
                  <span>Load from database or upload the student and payment Excel files.</span>
                </div>
                <div class="us-table-scroll" id="us-table-scroll" hidden>
                  <table class="us-table" id="us-table"></table>
                </div>
              </section>
            </div>

            <div class="us-popup" id="us-popup" hidden>
              <div class="us-popup-card">
                <button class="us-popup-close" id="us-popup-close" aria-label="Close">×</button>
                <h2 id="us-popup-title">Detail</h2>
                <p id="us-popup-meta"></p>
                <div id="us-popup-body"></div>
              </div>
            </div>
            <div class="us-toast" id="us-toast"></div>
          </section>
          <section class="page" id="staff" data-simple-page="staff"></section>
          <section class="page" id="inventory" data-simple-page="inventory"></section>
          <section class="page" id="letters" data-simple-page="letters"></section>
          <section class="page" id="users" data-simple-page="users"></section>
          <section class="page" id="audit" data-simple-page="audit"></section>
          <section class="page" id="diagnostics" data-simple-page="diagnostics"></section>
          <section class="page" id="client"></section>
        </main>
      </div>
    </div>
    <!-- END APP SHELL -->
    <script src="config.js"></script>
    <script>const APP_VERSION = "a5.19.07.2026.2";</script>
    <script src="session-manager.js"></script>
    <script src="local-store.js"></script>
    <script src="utils.js"></script>
    <script src="translations.js"></script>
    <script src="app.js"></script>
    <script src="staff-module.js"></script>
    <script src="letters-admin.js"></script>
    <script src="inventory-module.js"></script>
    <script src="audit.js"></script>
    <script src="auth.js"></script>
    <script src="students.js"></script>
    <script src="student-module/student-overview.js"></script>
    <script src="us-payment.js"></script>
    <script src="attendance.js"></script>
    <script src="users.js"></script>
    <script src="inventory.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="diagnostics.js"></script>
    <script src="client.js"></script>
  </body>
</html>
